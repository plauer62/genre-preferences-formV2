<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Likes / Dislikes Survey (V2)</title>

  <style>
    :root{
      --bg:#000;
      --pill:#cfcfcf;
      --like:#49e000;
      --dislike:#ff1a1a;
      --thumb:#ffffff;
      --thumbOff:#6e6e6e;
      --text:#fff;
      --muted:#bdbdbd;
      --shadow: 0 10px 30px rgba(0,0,0,.45);

      /* GLOBAL SCALE — dynamic across devices */
      --ui: 1;
    }

    /* Boost scale on touch devices (phones/tablets) */
    @media (hover:none) and (pointer:coarse){
      :root{ --ui: 1.12; }
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 50% 0%, #111 0%, #000 55%, #000 100%);
      color:var(--text);

      /* IMPORTANT: remove the “extra margin” feeling on mobile */
      padding: 0;
      min-height: 100dvh;

      display:flex;
      justify-content:center;
      align-items:stretch;

      /* safe areas for iPhone notch */
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .phone{
      width: min(760px, 100vw);
      min-height: 100dvh;

      background: linear-gradient(#0a0a0a, #000);
      padding: calc(18px * var(--ui)) calc(14px * var(--ui)) calc(14px * var(--ui));
      display:flex;
      flex-direction:column;
    }

    /* Desktop-only: add a “card” look. Mobile stays full-bleed. */
    @media (min-width: 700px){
      body{ padding: 18px; }
      .phone{
        border-radius: 28px;
        border: 1px solid rgba(255,255,255,.06);
        box-shadow: var(--shadow);
        min-height: min(92vh, 920px);
      }
    }

    h1{
      margin: calc(8px * var(--ui)) 0 calc(6px * var(--ui));
      font-size: clamp(calc(22px * var(--ui)), 5.8vw, calc(32px * var(--ui)));
      font-weight: 900;
      text-align:center;
      letter-spacing:.01em;
    }

    .sub{
      margin: 0 0 calc(14px * var(--ui));
      text-align:center;
      font-size: clamp(calc(14px * var(--ui)), 3.8vw, calc(19px * var(--ui)));
      color: var(--muted);
      line-height: 1.3;
    }

    .headers{
      display:grid;
      grid-template-columns: calc(76px * var(--ui)) 1fr calc(76px * var(--ui));
      align-items:end;
      padding: 0 calc(6px * var(--ui)) calc(12px * var(--ui));
      font-size: clamp(calc(13px * var(--ui)), 3.4vw, calc(17px * var(--ui)));
      font-weight: 900;
      letter-spacing:.08em;
      opacity:.95;
    }
    .headers div:nth-child(1){text-align:left}
    .headers div:nth-child(3){text-align:right}

    .list{
      flex:1;
      overflow:auto;
      padding-right: 6px;
      padding-bottom: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.25) transparent;
    }
    .list::-webkit-scrollbar{width:8px}
    .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:10px}

    .groupLabel{
      margin: calc(12px * var(--ui)) calc(8px * var(--ui)) calc(8px * var(--ui));
      font-size: clamp(calc(12px * var(--ui)), 3vw, calc(14px * var(--ui)));
      letter-spacing:.10em;
      text-transform:uppercase;
      color: rgba(255,255,255,.6);
    }

    .row{
      display:grid;
      grid-template-columns: calc(76px * var(--ui)) 1fr calc(76px * var(--ui));
      gap: calc(14px * var(--ui));
      align-items:center;
      padding: calc(10px * var(--ui)) calc(6px * var(--ui));
    }

    .pill{
      height: clamp(calc(52px * var(--ui)), 12.5vw, calc(66px * var(--ui)));
      border-radius: 999px;
      background: var(--pill);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#111;
      font-weight: 900;
      font-size: clamp(calc(16px * var(--ui)), 4.6vw, calc(22px * var(--ui)));
      letter-spacing:.01em;
      user-select:none;
    }
    .pill.like{ background: var(--like); color:#061b00; }
    .pill.dislike{ background: var(--dislike); color:#240000; }

    .thumbBtn{
      width: clamp(calc(60px * var(--ui)), 14.5vw, calc(72px * var(--ui)));
      height: clamp(calc(60px * var(--ui)), 14.5vw, calc(72px * var(--ui)));
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      transition: transform .06s ease, background .15s ease, border-color .15s ease;
    }
    .thumbBtn:active{ transform: scale(.985); }
    .thumbBtn svg{
      width: clamp(calc(28px * var(--ui)), 6.4vw, calc(34px * var(--ui)));
      height: clamp(calc(28px * var(--ui)), 6.4vw, calc(34px * var(--ui)));
      fill:none;
      stroke-width: 2.35;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .thumbBtn .stroke{ stroke: var(--thumb); }
    .thumbBtn.off .stroke{ stroke: var(--thumbOff); }

    .thumbBtn.onLike{
      background: rgba(73,224,0,.16);
      border-color: rgba(73,224,0,.40);
    }
    .thumbBtn.onLike .stroke{ stroke: var(--like); }

    .thumbBtn.onDislike{
      background: rgba(255,26,26,.16);
      border-color: rgba(255,26,26,.40);
    }
    .thumbBtn.onDislike .stroke{ stroke: var(--dislike); }

    .actions{
      margin-top: calc(12px * var(--ui));
      display:flex;
      justify-content:center;
    }

    .save{
      border:none;
      background:#fff;
      color:#000;
      font-weight: 1000;
      letter-spacing:.10em;
      padding: calc(14px * var(--ui)) calc(36px * var(--ui));
      border-radius: 999px;
      cursor:pointer;
      font-size: clamp(calc(15px * var(--ui)), 4vw, calc(19px * var(--ui)));
    }

    .hint{
      margin: calc(12px * var(--ui)) 0 0;
      font-size: clamp(calc(14px * var(--ui)), 3.9vw, calc(18px * var(--ui)));
      color: rgba(255,255,255,.62);
      text-align:center;
      line-height:1.35;
    }

    .output{
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      color: rgba(255,255,255,.9);
      display:none;
    }
  </style>
</head>

<body>
  <div class="phone" role="application" aria-label="Likes and Dislikes survey">
    <h1>Tell us what you like and dislike…</h1>
    <p class="sub">(this determines what you see on home page)</p>

    <div class="headers">
      <div>LIKE</div>
      <div></div>
      <div>DISLIKE</div>
    </div>

    <div id="list" class="list" aria-live="polite"></div>

    <div class="actions">
      <button id="saveBtn" class="save" type="button">SAVE</button>
    </div>

    <p class="hint">(You can edit Likes/Dislikes at any time in Personalization tab of Settings.)</p>
    <div id="output" class="output"></div>
  </div>

  <script>
    const GENRES = [
      "Family","Horror","Action Adventure","Romance","Crime","Documentary","Animation","Comedy",
      "Reality TV","Game Shows","Sci-Fi","Thriller","Drama","Mystery","Fantasy","Musical"
    ];

    const STORAGE_KEY = "likesDislikesPreferences_v2";

    const saved = (() => {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
      catch { return null; }
    })();

    let items = GENRES.map((label, i) => ({
      id: "g" + i,
      label,
      state: (saved && saved.states && saved.states[label]) || "unchecked",
      originalIndex: i
    }));

    const listEl = document.getElementById("list");
    const outputEl = document.getElementById("output");
    const saveBtn = document.getElementById("saveBtn");

    function sortItems(arr){
      const order = { like: 0, dislike: 1, unchecked: 2 };
      return [...arr].sort((a,b) => {
        const d = order[a.state] - order[b.state];
        if (d !== 0) return d;
        return a.originalIndex - b.originalIndex;
      });
    }

    function groupLabelFor(state){
      if (state === "like") return "Liked";
      if (state === "dislike") return "Disliked";
      return "Unchecked";
    }

    function thumbSVG(){
      return `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="stroke" d="M14 10V5.5c0-1.2-1-2.2-2.2-2.2H11L7.8 10.2c-.3.6-.4 1.2-.2 1.8l.9 2.9c.2.6.8 1.1 1.5 1.1H16c.8 0 1.5-.5 1.7-1.3l1.1-4.4c.2-.9-.4-1.8-1.3-2H14z"/>
          <path class="stroke" d="M6 10v8"/>
        </svg>
      `;
    }

    function render(){
      const sorted = sortItems(items);
      const groups = { like: [], dislike: [], unchecked: [] };
      for (const it of sorted) groups[it.state].push(it);

      const sections = ["like","dislike","unchecked"]
        .filter(k => groups[k].length > 0)
        .map(k => {
          const rows = groups[k].map(it => rowHTML(it)).join("");
          return `<div class="groupLabel">${groupLabelFor(k)}</div>${rows}`;
        }).join("");

      listEl.innerHTML = sections;

      for (const it of items){
        const likeBtn = document.getElementById(`like-${it.id}`);
        const dislikeBtn = document.getElementById(`dislike-${it.id}`);
        if (likeBtn) likeBtn.onclick = () => toggle(it.id, "like");
        if (dislikeBtn) dislikeBtn.onclick = () => toggle(it.id, "dislike");
      }
    }

    function rowHTML(it){
      const isLike = it.state === "like";
      const isDislike = it.state === "dislike";

      const likeClass =
        isLike ? "thumbBtn onLike" : (isDislike ? "thumbBtn off" : "thumbBtn");
      const dislikeClass =
        isDislike ? "thumbBtn onDislike" : (isLike ? "thumbBtn off" : "thumbBtn");

      const pillClass = isLike ? "pill like" : (isDislike ? "pill dislike" : "pill");

      return `
        <div class="row" data-state="${it.state}">
          <button id="like-${it.id}" class="${likeClass}" type="button" aria-label="Like ${it.label}">
            ${thumbSVG()}
          </button>

          <div class="${pillClass}" role="button" tabindex="0" aria-label="${it.label}">
            ${it.label}
          </div>

          <button id="dislike-${it.id}" class="${dislikeClass}" type="button" aria-label="Dislike ${it.label}">
            ${thumbSVG().replace('viewBox="0 0 24 24"', 'viewBox="0 0 24 24" style="transform: rotate(180deg)"')}
          </button>
        </div>
      `;
    }

    function toggle(itemId, action){
      const it = items.find(x => x.id === itemId);
      if (!it) return;

      if (action === "like"){
        it.state = (it.state === "like") ? "unchecked" : "like";
      } else {
        it.state = (it.state === "dislike") ? "unchecked" : "dislike";
      }
      render();
    }

    function buildPayload(){
      const liked = items.filter(i => i.state === "like").map(i => i.label);
      const disliked = items.filter(i => i.state === "dislike").map(i => i.label);
      const unchecked = items.filter(i => i.state === "unchecked").map(i => i.label);
      const states = {};
      for (const it of items) states[it.label] = it.state;

      return { version: 2, updatedAt: new Date().toISOString(), liked, disliked, unchecked, states };
    }

    saveBtn.addEventListener("click", () => {
      const payload = buildPayload();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      outputEl.style.display = "block";
      outputEl.textContent = JSON.stringify(payload, null, 2);
    });

    render();
  </script>
</body>
</html>
